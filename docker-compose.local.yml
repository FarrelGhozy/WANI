# Local development — WAHA connects to host PostgreSQL instead of the db container
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.local.yml up -d waha

services:
  waha:
    depends_on: {}
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      WHATSAPP_SESSIONS_POSTGRESQL_URL: postgres://${DATABASE_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/postgres?sslmode=disable
      WAHA_MEDIA_POSTGRESQL_URL: postgres://${DATABASE_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/postgres?sslmode=disable
